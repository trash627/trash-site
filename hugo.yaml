  homeInfoParams:
    Title: Promit Panja
    Content: |
      I am a second-year PhD student in Computer Science at the Karlsruhe Institute of Technology (KIT), Germany, 
      and part of the [**Logic of Autonomous Dynamical Systems**](https://logic.kastel.kit.edu/) research group advised 
      by [**Prof. André Platzer**](https://symbolaris.com/index.html). My current research involves developing logical
      methods for proving safety of continuous and hybrid dynamical systems.

      Prior to joining KIT, I was a master's student at Virginia Tech, USA, primarily researching nonlinear control theory and safety-critical robotics.

    imageUrl: "img/ppanja.jpg"
    imageTitle: profile
    imageWidth: 200
    imageHeight: 200


