  homeInfoParams:
    Title: Promit Panja
    Content: |
      I am a second-year PhD student in Computer Science at the Karlsruhe Institute of Technology (KIT), Germany, 
      and part of the [Logic of Autonomous Dynamical Systems](https://logic.kastel.kit.edu/) research group advised 
      by Prof. [André Platzer](https://symbolaris.com/index.html). My current research involves devoloping logical 
      methods for proving safety of continuous and hybdrid dynamical systems.

      Prior to joining KIT, I was a master's student at Virginia Tech, USA, primarily researching safety in robotic systems.

